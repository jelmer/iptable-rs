[package]
name = "iptable"
version = "0.3.0"
edition = "2021"
description = "Datastructure for efficient IP address lookup"
license = "Apache-2.0"
authors = ["Jelmer Vernooĳ <jelmer@jelmer.uk>"]
repository = "https://github.com/jelmer/iptable-rs"
homepage = "https://github.com/jelmer/iptable-rs"

[features]
default = ["ipnetwork"]
ipnetwork = ["dep:ipnetwork"]
ipnet = ["dep:ipnet"]

[dependencies]
ipnetwork = { version = "0.21.1", optional = true }
ipnet = { version = "2.9", optional = true }

[dev-dependencies]
criterion = { version = ">=0.5", features = ["html_reports"] }
rand = "0.10.1"

[[bench]]
name = "populate"
path = "bench/populate.rs"
harness = false
required-features = ["ipnetwork"]

[package.metadata.docs.rs]
all-features = true
